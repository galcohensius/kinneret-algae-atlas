<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="study-area-map-title study-area-map-desc">
  <title id="study-area-map-title">Lake Kinneret regional map</title>
  <desc id="study-area-map-desc">Schematic map showing Lake Kinneret in northeastern Israel, east of the Mediterranean coast.</desc>
