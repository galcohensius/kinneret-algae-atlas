    <linearGradient id="sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" fill="#f8fafc"/>
  <rect x="18" y="28" width="120" height="244" rx="8" fill="url(#sea)"/>
  <text x="78" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">Mediterranean</text>
  <text x="78" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">Sea</text>
