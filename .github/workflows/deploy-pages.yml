# Build static site and deploy to GitHub Pages (site at domain root; see
# docs/DEVELOPMENT.md "Deploy" for /repo-name/ builds via NEXT_PUBLIC_BASE_PATH).
# Repo settings → Pages → Build: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/checks.yml
    with:
      upload-pages-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
