# Shared test-and-build steps. Called by ci.yml (every push/PR) and by
# deploy-pages.yml (push to main), so a check added here runs in both.
name: Checks

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload out/ as the GitHub Pages artifact after a successful build.
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python extractor tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate algae JSON
        run: npm run validate:data
      - name: Typecheck
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Generated files are up to date
        # The committed search index and llms/API files must match data/processed.
        run: |
          npm run generate:search-index
          npm run generate:llms
          git diff --exit-code -- public/api public/llms.txt public/llms-full.txt
      - name: Build static export
        run: npm run build
        env:
          # Repo settings -> Secrets and variables -> Actions -> Variables.
          # Unset until the GoatCounter account exists; the build then ships no analytics.
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ vars.NEXT_PUBLIC_GOATCOUNTER_CODE }}
      - name: Check exported links and assets
        run: npm run test:export
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.upload-pages-artifact }}
        with:
          path: out
